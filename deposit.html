<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depósito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <h3 class="text-center">Depositar Dinero</h3>
                    <p class="text-center">Saldo actual: <span class="verSaldo">$150000</span></p>

                    <form id="formDeposito">
                        <div class="mb-3">
                            <label class="form-label">Monto a cargar</label>
                            <input type="number" id="monto" class="form-control" placeholder="Ej: 5000" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mb-2">Aceptar</button>
                        <a href="menu.html" class="btn btn-secondary w-100">Volver</a>
                    </form>

                    <div id="mensaje" class="alert alert-success mt-3 d-none">
                        ¡Carga realizada!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
