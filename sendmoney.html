<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Transferir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <h3 class="text-center">Enviar Dinero</h3>

                    <div class="mb-3">
                        <label class="form-label">Buscar amigo:</label>
                        <input type="text" id="buscar" class="form-control" placeholder="Escribe un nombre...">
                        <div id="lista" class="list-group mt-1"></div>
                    </div>

                    <form id="formTransferir">
                        <div class="mb-3">
                            <label class="form-label">Para:</label>
                            <input type="text" id="contacto" class="form-control" readonly required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Monto:</label>
                            <input type="number" id="montoEnvio" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-2">Enviar</button>
                        <a href="menu.html" class="btn btn-secondary w-100">Volver</a>
                    </form>

                    <div id="msgOk" class="alert alert-success mt-3 d-none">
                        ¡Dinero enviado correctamente!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
